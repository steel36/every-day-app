<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Every Day">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFEAE0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Daily Word — App Mockup</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --night:      #2B2A4A;
  --dawn:       #E8A33D;
  --paper:      #EFEAE0;
  --paper-dim:  #E4DECF;
  --moss:       #4A5D45;
  --ink:        #24261F;
  --ink-soft:   #5B5D52;
  --card:       #FBF9F3;
  --line:       rgba(36,38,31,0.10);
  --radius:     22px;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background: #1c1b30;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
  background:
    radial-gradient(circle at 20% 10%, rgba(232,163,61,0.10), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(43,42,74,0.6), transparent 55%),
    #1c1b30;
}

.phone{
  width:390px;
  max-width:100%;
  height:800px;
  background:var(--paper);
  border-radius:44px;
  border:8px solid #0f0e1c;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}

/* On an actual phone screen, drop the desktop "frame" mockup entirely
   and let the app fill the real device screen edge-to-edge. */
@media (max-width: 500px){
  body{
    padding:0;
    align-items:stretch;
    background:var(--paper);
  }
  .phone{
    width:100%;
    height:100dvh;
    border:none;
    border-radius:0;
    box-shadow:none;
  }
  .screen{ padding-top: max(20px, env(safe-area-inset-top, 20px)); }
  .statusbar{ display:none !important; }
}

.statusbar{
  height:46px;
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 24px 8px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:0.02em;
  color:var(--ink);
}

.screen{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding: 6px 22px 20px;
  display:none;
}
.screen.active{ display:block; }

/* ---------- horizon signature element ---------- */
.horizon{
  height:5px;
  border-radius:6px;
  margin: 6px 0 20px;
  background: linear-gradient(90deg, var(--night) 0%, #6b5f8f 30%, var(--dawn) 78%, #f6cf8e 100%);
  background-size: 200% 100%;
  background-position: 100% 0;
  transition: background-position 1.1s cubic-bezier(.4,0,.2,1), filter .6s ease;
  filter: saturate(0.75);
}
.horizon.lit{
  background-position: 0% 0;
  filter: saturate(1.15) brightness(1.05);
}

/* ---------- header ---------- */
.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:2px;
}
.greeting{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:30px;
  line-height:1.15;
  color:var(--ink);
}
.date-line{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-top:4px;
}
.streak-chip{
  display:flex;
  align-items:center;
  gap:5px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:100px;
  padding:6px 12px 6px 10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;
  font-weight:500;
  color:var(--moss);
  white-space:nowrap;
}

.meta-row{
  display:flex;
  gap:8px;
  margin: 14px 0 4px;
}
.meta-pill{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:0.05em;
  text-transform:uppercase;
  padding:5px 10px;
  border-radius:100px;
  background:var(--paper-dim);
  color:var(--ink-soft);
}
.version-note{
  font-family:'Inter',sans-serif;
  font-size:13px;
  color:var(--ink-soft);
  margin: 8px 2px 0;
  line-height:1.4;
}

/* ---------- reading card ---------- */
.reading-card{
  margin-top:14px;
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--line);
  padding:22px 20px 18px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 14px 30px rgba(43,42,74,0.06);
}

.testament-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--night);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:6px;
}
.testament-label.nt{ color:#b5731c; }
.testament-label .dot{
  width:5px;height:5px;border-radius:50%;
  background:currentColor;
}

.verse-text{
  font-family:'Fraunces',serif;
  font-weight:400;
  font-size:22px;
  line-height:1.55;
  color:var(--ink);
  margin:0 0 6px;
}
.verse-ref{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.04em;
  color:var(--ink-soft);
}

.divider{
  height:1px;
  background:var(--line);
  margin:20px 0;
}

/* ---------- why panel ---------- */
.reflect-card{
  margin-top:14px;
}
.section-heading{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:25px;
  letter-spacing:-0.01em;
  color:var(--ink);
  margin-bottom:16px;
  opacity:1;
}
.why-inner{
  font-family:'Inter',sans-serif;
  font-size:17px;
  line-height:1.65;
  color:var(--ink-soft);
}

/* ---------- complete button ---------- */
.complete-btn{
  width:100%;
  margin-top:22px;
  padding:16px;
  border-radius:16px;
  border:none;
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:17px;
  cursor:pointer;
  background: var(--night);
  color:var(--paper);
  transition: background .25s ease, transform .15s ease;
}
.complete-btn:active{ transform: scale(0.98); }
.complete-btn.done{
  background: var(--moss);
  color:#fff;
}
.complete-btn .check{ margin-right:6px; }

.reading-time-note{
  text-align:center;
  font-size:13px;
  color:var(--ink-soft);
  margin-top:10px;
  font-family:'IBM Plex Mono',monospace;
}

/* ---------- week dots (progress) ---------- */
.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin:26px 0 10px;
}
.week-row{ display:flex; gap:8px; margin-bottom:6px; }
.week-day{
  flex:1;
  aspect-ratio:1;
  border-radius:10px;
  background:var(--paper-dim);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  position:relative;
}
.week-day.done{
  background: linear-gradient(135deg, var(--moss), #6b8a63);
  color:#fff;
}
.week-day.today{
  outline:2px solid var(--dawn);
  outline-offset:2px;
}

.progress-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-top:12px;
}
.progress-title{
  font-family:'Fraunces',serif;
  font-size:19px;
  margin:0 0 12px;
}
.bar-row{ margin-bottom:14px; }
.bar-label{
  display:flex; justify-content:space-between;
  font-size:14px; color:var(--ink-soft); margin-bottom:6px;
  font-family:'IBM Plex Mono',monospace;
}
.bar-track{
  height:8px; border-radius:6px; background:var(--paper-dim); overflow:hidden;
}
.bar-fill{ height:100%; border-radius:6px; }
.bar-fill.ot{ background: var(--night); }
.bar-fill.nt{ background: var(--dawn); }

.streak-hero{
  text-align:center;
  padding: 18px 0 6px;
}
.streak-num{
  font-family:'Fraunces',serif;
  font-size:58px;
  color:var(--ink);
  line-height:1;
}
.streak-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
  margin-top:6px;
}

/* ---------- tab bar ---------- */
.tabbar{
  flex-shrink:0;
  display:flex;
  border-top:1px solid var(--line);
  background: var(--paper);
  padding: 10px 10px calc(14px + env(safe-area-inset-bottom, 0px));
}
.tab{
  flex:1;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:12px;
  font-weight:600;
  color:var(--ink-soft);
  padding:4px 0;
}
.tab.active{ color:var(--ink); }
.tab svg{ width:22px; height:22px; }
.tab.active svg{ stroke:var(--dawn); }

/* scrollbar tidy */
.screen::-webkit-scrollbar{ width:0; }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span>EVERY DAY</span>
  </div>

  <!-- ============ TODAY ============ -->
  <div class="screen active" id="screen-today">
    <div class="top-row">
      <div>
        <div class="greeting" id="greeting">Good morning.</div>
        <div class="date-line" id="date-line">Sunday, August 30</div>
      </div>
      <div class="streak-chip">🔥 <span id="streak-chip-num">0</span> days</div>
    </div>

    <div class="horizon" id="horizon"></div>

    <div class="meta-row">
      <div class="meta-pill" id="reading-time-pill">≈ 6 min read</div>
      <div class="meta-pill">WEB</div>
    </div>

    <div class="reading-card">
      <div class="section-heading">Read</div>
      <div class="testament-label"><span class="dot"></span>Old Testament</div>
      <div id="ot-text"></div>
      <div class="verse-ref" id="ot-ref"></div>

      <div class="divider"></div>

      <div class="testament-label nt"><span class="dot"></span>New Testament</div>
      <div id="nt-text"></div>
      <div class="verse-ref" id="nt-ref"></div>

    </div>

    <div class="reading-card reflect-card">
      <div class="section-heading">Reflect</div>
      <div class="why-inner" id="reflect-text"></div>
    </div>

    <button class="complete-btn" id="complete-btn" onclick="toggleComplete()">Mark today's reading complete</button>
    <div class="reading-time-note" id="reading-time-note">Start your streak today</div>
  </div>

  <!-- ============ PROGRESS ============ -->
  <div class="screen" id="screen-progress">
    <div class="top-row">
      <div>
        <div class="greeting">Your progress</div>
        <div class="date-line">This week</div>
      </div>
    </div>

    <div class="streak-hero">
      <div class="streak-num" id="streak-num-big">0</div>
      <div class="streak-label">day streak</div>
    </div>

    <div class="week-row" id="week-row"></div>

    <div class="section-label">Reading through the Bible</div>
    <div class="progress-card">
      <p class="progress-title">Since you started</p>
      <div class="bar-row">
        <div class="bar-label"><span>Old Testament</span><span id="ot-pct">0%</span></div>
        <div class="bar-track"><div class="bar-fill ot" id="ot-bar" style="width:0%"></div></div>
      </div>
      <div class="bar-row">
        <div class="bar-label"><span>New Testament</span><span id="nt-pct">0%</span></div>
        <div class="bar-track"><div class="bar-fill nt" id="nt-bar" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-screen="screen-today" onclick="showScreen('screen-today', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M5 8h14M5 8a7 7 0 0 0 14 0"/></svg>
      Today
    </button>
    <button class="tab" data-screen="screen-progress" onclick="showScreen('screen-progress', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M12 19V4M20 19v-6"/></svg>
      Progress
    </button>
  </div>
</div>

<script>
/* ---------- content calendar ----------
   Each entry is one day's reading. Content rotates through this list based
   on the real calendar date, so it changes on its own every day rather than
   needing to be swapped by hand. Add more entries any time to extend the plan. */
const READINGS = [
  {
    theme: 'Hearing God',
    readingTime: '≈ 6 min read',
    ot: {
      ref: '1 KINGS 19:9–13',
      paragraphs: [
        `He came there to a cave, and lodged there; and behold, Yahweh's word came to him, and he said to him, "What are you doing here, Elijah?" He said, "I have been very jealous for Yahweh, the God of Armies; for the children of Israel have forsaken your covenant, thrown down your altars, and killed your prophets with the sword. I, even I only, am left; and they seek my life, to take it away."`,
        `He said, "Go out, and stand on the mountain before Yahweh." Behold, Yahweh passed by, and a great and strong wind tore the mountains, and broke in pieces the rocks before Yahweh; but Yahweh was not in the wind. After the wind there was an earthquake; but Yahweh was not in the earthquake. After the earthquake a fire passed; but Yahweh was not in the fire. After the fire there was a still small voice.`,
        `When Elijah heard it, he wrapped his face in his mantle, and went out, and stood in the entrance of the cave. Behold, a voice came to him, and said, "What are you doing here, Elijah?"`
      ]
    },
    nt: {
      ref: 'JOHN 10:1–5, 14, 27–28',
      paragraphs: [
        `"Most certainly, I tell you, one who doesn't enter by the door into the sheep fold, but climbs up some other way, is a thief and a robber. But one who enters in by the door is the shepherd of the sheep. The gatekeeper opens the gate for him, and the sheep listen to his voice. He calls his own sheep by name, and leads them out. Whenever he brings out his own sheep, he goes before them; and the sheep follow him, for they know his voice. They will by no means follow a stranger, but will flee from him; for they don't know the voice of strangers."`,
        `I am the good shepherd. I know my own, and I'm known by my own; my sheep hear my voice, and I know them, and they follow me. I give eternal life to them. They will never perish, and no one will snatch them out of my hand.`
      ]
    },
    reflect: `Elijah expected to find God in the wind, the earthquake, the fire — and instead found him in a whisper. Jesus describes a similar kind of listening: sheep who know their shepherd's voice well enough to recognize it anywhere, apart from every other voice. Hearing God rarely starts with something dramatic. It starts with staying quiet and familiar enough with his voice to notice it.`
  },
  {
    theme: 'Walking with God',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'PSALM 25:1–2, 4–5, 8–10',
      paragraphs: [
        `To you, Yahweh, I lift up my soul. My God, I have trusted in you. Don't let me be shamed. Don't let my enemies triumph over me.`,
        `Show me your ways, Yahweh. Teach me your paths. Guide me in your truth, and teach me, for you are the God of my salvation, I wait for you all day long.`,
        `Good and upright is Yahweh, therefore he will instruct sinners in the way. He will guide the humble in justice. He will teach the humble his way. All the paths of Yahweh are loving kindness and truth to such as keep his covenant and his testimonies.`
      ]
    },
    nt: {
      ref: 'GALATIANS 5:16–18, 22–25',
      paragraphs: [
        `I say, walk by the Spirit, and you won't fulfill the lust of the flesh. For the flesh lusts against the Spirit, and the Spirit against the flesh; and these are contrary to one another, that you may not do the things that you desire. But if you are led by the Spirit, you are not under the law.`,
        `The fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Against such things there is no law. Those who belong to Christ have crucified the flesh with its passions and lusts. If we live by the Spirit, let's also walk by the Spirit.`
      ]
    },
    reflect: `Psalm 25 is a daily prayer for direction — teach me, lead me, show me the way. Galatians 5 shows what that walk actually looks like: not one giant decision, but a daily choice to walk by the Spirit rather than the flesh, one that quietly produces its own fruit over time. Walking with God isn't a leap. It's today's steps, repeated.`
  },
  {
    theme: 'Trust',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'PROVERBS 3:5–8',
      paragraphs: [
        `Trust in Yahweh with all your heart, and don't lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight. Don't be wise in your own eyes. Fear Yahweh, and depart from evil. It will be health to your body, and nourishment to your bones.`
      ]
    },
    nt: {
      ref: 'MATTHEW 6:25–27, 31–34',
      paragraphs: [
        `"Therefore I tell you, don't be anxious for your life: what you will eat, or what you will drink; nor yet for your body, what you will wear. Isn't life more than food, and the body more than clothing? See the birds of the sky, that they don't sow, neither reap, nor gather into barns. Your heavenly Father feeds them. Aren't you of much more value than they? Which of you, by being anxious, can add one moment to his lifespan?"`,
        `"Therefore don't be anxious, saying, 'What will we eat?', 'What will we drink?' or, 'With what will we be clothed?' For the Gentiles seek after all these things. But seek first God's Kingdom and his righteousness, and all these things will be given to you as well. Therefore don't be anxious for tomorrow, for tomorrow will be anxious for itself. Each day's own evil is sufficient."`
      ]
    },
    reflect: `Proverbs asks for trust before understanding — leaning on God rather than waiting to have it all figured out first. Jesus makes a similar point with birds and clothing: worry doesn't actually add anything, it just steals today's peace over things that may never come. Trust isn't the absence of concern. It's bringing that concern to God daily instead of carrying it alone.`
  },
  {
    theme: 'Prayer',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'PSALM 145:14–19',
      paragraphs: [
        `Yahweh upholds all who fall, and raises up all those who are bowed down. The eyes of all wait for you. You give them their food in due season. You open your hand, and satisfy the desire of every living thing.`,
        `Yahweh is righteous in all his ways, and gracious in all his works. Yahweh is near to all those who call on him, to all who call on him in truth. He will fulfill the desire of those who fear him. He also will hear their cry, and will save them.`
      ]
    },
    nt: {
      ref: 'PHILIPPIANS 4:6–7; MATTHEW 6:6',
      paragraphs: [
        `Don't be anxious about anything, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.`,
        `"But you, when you pray, enter into your inner room, and having shut your door, pray to your Father who is in secret; and your Father who sees in secret will reward you openly."`
      ]
    },
    reflect: `Psalm 145 pictures God as near to everyone who calls on him — not distant, not hard to reach. Philippians and Matthew both point to the same posture: bring it to God plainly, in quiet, and let peace replace anxiety rather than the other way around. Prayer isn't a formality before God acts. It's the place where his peace actually starts.`
  },
  {
    theme: 'Hope',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'ISAIAH 40:28–31',
      paragraphs: [
        `Haven't you known? Haven't you heard? The everlasting God, Yahweh, the Creator of the ends of the earth, doesn't faint. He isn't weary. His understanding is unsearchable. He gives power to the weak. He increases the strength of him who has no might.`,
        `Even the youths faint and get weary, and the young men utterly fall; but those who wait for Yahweh will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.`
      ]
    },
    nt: {
      ref: 'ROMANS 5:1–5',
      paragraphs: [
        `Being therefore justified by faith, we have peace with God through our Lord Jesus Christ; through whom we also have our access by faith into this grace in which we stand. We rejoice in hope of the glory of God.`,
        `Not only this, but we also rejoice in our sufferings, knowing that suffering produces perseverance; and perseverance, proven character; and proven character, hope: and hope doesn't disappoint us, because God's love has been poured out into our hearts through the Holy Spirit who was given to us.`
      ]
    },
    reflect: `Isaiah's hope is about renewal — strength that comes back, not from trying harder, but from waiting on God. Paul's hope in Romans is stranger: it grows out of hardship itself, not around it. Both point to the same thing — hope in this life isn't naive optimism. It's something God builds in you, often through the very things that felt like they'd wear you down.`
  },
  {
    theme: 'Humility',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'MICAH 6:6–8',
      paragraphs: [
        `How shall I come before Yahweh, and bow myself before the exalted God? Shall I come before him with burnt offerings, with calves a year old? Will Yahweh be pleased with thousands of rams? With ten thousands of rivers of oil? Shall I give my firstborn for my disobedience? The fruit of my body for the sin of my soul?`,
        `He has shown you, O man, what is good. What does Yahweh require of you, but to act justly, to love mercy, and to walk humbly with your God?`
      ]
    },
    nt: {
      ref: 'PHILIPPIANS 2:3–8',
      paragraphs: [
        `Doing nothing through rivalry or through conceit, but in humility, each counting others better than himself; each of you not just looking to his own things, but each of you also to the things of others.`,
        `Have this in your mind, which was also in Christ Jesus, who, existing in the form of God, didn't consider equality with God a thing to be grasped, but emptied himself, taking the form of a servant... he humbled himself, becoming obedient to death, yes, the death of the cross.`
      ]
    },
    reflect: `Micah cuts through religious performance to something simpler — justice, mercy, and a humble walk with God. Philippians shows what that humility looks like at its fullest: Jesus setting aside status entirely rather than clinging to it. Humility isn't thinking less of yourself. It's simply not needing to be first.`
  },
  {
    theme: 'Gratitude',
    readingTime: '≈ 6 min read',
    ot: {
      ref: 'PSALM 100',
      paragraphs: [
        `Shout for joy to Yahweh, all you lands! Serve Yahweh with gladness. Come before his presence with singing. Know that Yahweh, he is God. It is he who has made us, and we are his. We are his people, and the sheep of his pasture.`,
        `Enter into his gates with thanksgiving, and into his courts with praise. Give thanks to him, and bless his name. For Yahweh is good. His loving kindness endures forever, and his faithfulness to all generations.`

/* ---------- persistence ---------- */
const STORAGE_KEY = 'everyDayApp_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { completedDates: [] };
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed.completedDates)) return { completedDates: [] };
    return parsed;
  }catch(e){
    return { completedDates: [] };
  }
}
function saveData(data){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ /* storage unavailable, fail silently */ }
}

/* ---------- date helpers ----------
   The reading day, streak, and week view are all anchored to the calendar
   date in US Eastern time (America/New_York) — not the device's local
   timezone and not UTC. This means today's reading changes for everyone
   at 12:00am Eastern, regardless of what timezone a phone is set to. */
function getEasternParts(d){
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    year: 'numeric', month: '2-digit', day: '2-digit'
  });
  const parts = fmt.formatToParts(d).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  return { year: parseInt(parts.year, 10), month: parseInt(parts.month, 10), day: parseInt(parts.day, 10) };
}
function easternISODate(d){
  const { year, month, day } = getEasternParts(d);
  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
// A UTC-normalized Date representing the current Eastern calendar day at
// midnight. Safe to do plain day-arithmetic on (setUTCDate etc.) without
// DST or local-timezone surprises, since it's just Y/M/D math from here on.
function easternCalendarDate(d){
  const { year, month, day } = getEasternParts(d);
  return new Date(Date.UTC(year, month - 1, day));
}
function daysSinceEpoch(calendarDate){
  return Math.floor(calendarDate.getTime() / 86400000);
}
function toISODate(calendarDate){
  return calendarDate.toISOString().slice(0, 10);
}

let appData = loadData();
const today = easternCalendarDate(new Date());
const todayISO = toISODate(today);

/* ---------- pick today's reading ---------- */
/* ---------- pick today's reading: scheduled date takes priority, otherwise rotate ---------- */
const readingIndex = ((daysSinceEpoch(today) % READINGS.length) + READINGS.length) % READINGS.length;
const reading = SCHEDULE[todayISO] || READINGS[readingIndex];

// Reading time is computed from the actual text rather than hand-typed,
// so it can never drift out of sync with content again. 110 words/minute
// reflects a slow, reflective devotional pace rather than skimming speed.
const WORDS_PER_MINUTE = 110;
function estimateReadingMinutes(r){
  const wordCount = (r.ot.paragraphs.join(' ') + ' ' + r.nt.paragraphs.join(' '))
    .split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(wordCount / WORDS_PER_MINUTE));
}

function renderReading(){
  const minutes = estimateReadingMinutes(reading);
  document.getElementById('reading-time-pill').textContent = `≈ ${minutes} min read`;
  document.getElementById('ot-text').innerHTML = reading.ot.paragraphs.map(p => `<p class="verse-text">${p}</p>`).join('');
  document.getElementById('ot-ref').textContent = reading.ot.ref;
  document.getElementById('nt-text').innerHTML = reading.nt.paragraphs.map(p => `<p class="verse-text">${p}</p>`).join('');
  document.getElementById('nt-ref').textContent = reading.nt.ref;
  document.getElementById('reflect-text').textContent = reading.reflect;
}

/* ---------- streak calculation ---------- */
function computeStreak(completedDates){
  const set = new Set(completedDates);
  let streak = 0;
  let cursor = new Date(today);
  // If today isn't marked complete yet, start counting from yesterday
  // so an unfinished today doesn't zero out an existing streak.
  if(!set.has(todayISO)){
    cursor.setUTCDate(cursor.getUTCDate() - 1);
  }
  while(set.has(toISODate(cursor))){
    streak++;
    cursor.setUTCDate(cursor.getUTCDate() - 1);
  }
  return streak;
}

/* ---------- render streak + button state ---------- */
function renderStatus(){
  const isDoneToday = appData.completedDates.includes(todayISO);
  const streak = computeStreak(appData.completedDates);

  document.getElementById('streak-chip-num').textContent = streak;
  document.getElementById('streak-num-big').textContent = streak;

  const btn = document.getElementById('complete-btn');
  const horizon = document.getElementById('horizon');
  const note = document.getElementById('reading-time-note');

  if(isDoneToday){
    btn.classList.add('done');
    btn.innerHTML = '<span class="check">✓</span> Today\'s reading complete';
    horizon.classList.add('lit');
  }else{
    btn.classList.remove('done');
    btn.textContent = "Mark today's reading complete";
    horizon.classList.remove('lit');
  }

  note.textContent = streak > 0
    ? `You've read ${streak} day${streak === 1 ? '' : 's'} in a row`
    : 'Start your streak today';
}

function toggleComplete(){
  const idx = appData.completedDates.indexOf(todayISO);
  if(idx === -1){
    appData.completedDates.push(todayISO);
  }else{
    appData.completedDates.splice(idx, 1);
  }
  saveData(appData);
  renderStatus();
}

/* ---------- week row (Progress screen) ---------- */
function renderWeekRow(){
  const container = document.getElementById('week-row');
  container.innerHTML = '';
  const labels = ['S','M','T','W','T','F','S'];
  const startOfWeek = new Date(today);
  startOfWeek.setUTCDate(today.getUTCDate() - today.getUTCDay()); // back up to Sunday

  for(let i = 0; i < 7; i++){
    const d = new Date(startOfWeek);
    d.setUTCDate(startOfWeek.getUTCDate() + i);
    const iso = toISODate(d);
    const isDone = appData.completedDates.includes(iso);
    const isToday = iso === todayISO;

    const cell = document.createElement('div');
    cell.className = 'week-day' + (isDone ? ' done' : '') + (isToday ? ' today' : '');
    cell.textContent = labels[i];
    container.appendChild(cell);
  }
}

/* ---------- progress bars ----------
   Placeholder metric until a full reading plan is authored: percentage of a
   365-day plan completed so far. Both bars share this number for now since
   each day's reading always covers both testaments together. */
function renderProgressBars(){
  const totalDays = appData.completedDates.length;
  const pct = Math.min(100, Math.round((totalDays / 365) * 100));
  document.getElementById('ot-pct').textContent = pct + '%';
  document.getElementById('nt-pct').textContent = pct + '%';
  document.getElementById('ot-bar').style.width = pct + '%';
  document.getElementById('nt-bar').style.width = pct + '%';
}

/* ---------- greeting + date ---------- */
function renderGreeting(){
  const now = new Date();
  const hour = now.getHours(); // greeting matches the visitor's own local time of day
  const greeting = hour < 12 ? 'Good morning.' : hour < 18 ? 'Good afternoon.' : 'Good evening.';
  document.getElementById('greeting').textContent = greeting;

  // Date line always shows the Eastern-time calendar date (matches the
  // reading day), formatted directly to avoid UTC/local shift bugs.
  const dateFmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', weekday: 'long', month: 'long', day: 'numeric'
  });
  document.getElementById('date-line').textContent = dateFmt.format(now);
}

function showScreen(id, btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  if(id === 'screen-progress'){
    renderWeekRow();
    renderProgressBars();
  }
}

/* ---------- init ---------- */
renderGreeting();
renderReading();
renderStatus();
</script>
